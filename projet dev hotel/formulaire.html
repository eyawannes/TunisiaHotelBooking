<!DOCTYPE html>
<html>
<head>
    <title>Exercice 1</title>
</head>
<body>
    <form action="valider.html" method="get">
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom"><br><br>
        <label for="password">Mot de pass</label>
        <input type="password" id="password" name="password"><br><br>
        <label for="pays">Pays</label>
        <select id="pays" name="pays">
            <option value="tunisie">Tunisie</option>
            <option value="maroc">Maroc</option>
            <option value="algerie">Algérie</option>
        </select><br><br>
        <p>Quel est votre sport préféré ?</p>
        <input type="radio" id="handball" name="sport" value="handball">
        <label for="handball">Handball</label><br>
        <input type="radio" id="football" name="sport" value="football">
        <label for="football">Football</label><br>
        <input type="radio" id="tennis" name="sport" value="tennis">
        <label for="tennis">Tennis</label><br><br>
        <p>Comment vous vous amusez ?</p>
        <input type="checkbox" id="tv" name="amusement" value="tv">
        <label for="tv">TV</label><br>
        <input type="checkbox" id="radio" name="amusement" value="radio">
        <label for="radio">Radio</label><br>
        <input type="checkbox" id="cinema" name="amusement" value="cinema">
        <label for="cinema">Cinéma</label><br><br>
        <button type="reset">vider</button> 
        <button type="button" onclick="alert('Bouton envoyer cliqué')">envoyer</button>
        <button type="submit">connexion</button>
    </form>
</body>
</html>
